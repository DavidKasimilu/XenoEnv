<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Retro Snake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    touch-action: none;
    overflow: hidden;
  }
  .header {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #1e293b;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .score-badge { font-size: 16px; font-weight: bold; color: #38bdf8; }
  .high-badge { font-size: 14px; color: #94a3b8; }
  canvas {
    background: #020617;
    border: 2px solid #38bdf8;
    border-radius: 16px;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    max-width: 92vw;
    max-height: 52vh;
  }
  .controls {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 72px);
    grid-template-rows: repeat(3, 62px);
    gap: 8px;
    justify-content: center;
  }
  .btn {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    color: #f8fafc;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .btn:active { background: #38bdf8; color: #020617; transform: scale(0.95); }
  .btn-up { grid-column: 2; grid-row: 1; }
  .btn-left { grid-column: 1; grid-row: 2; }
  .btn-down { grid-column: 2; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }
  .game-over-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(2, 6, 23, 0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .restart-btn {
    margin-top: 16px;
    padding: 12px 28px;
    background: #38bdf8;
    color: #020617;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="score-badge">Score: <span id="score">0</span></div>
    <div class="high-badge">Best: <span id="highScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="360" height="360"></canvas>

  <div class="controls">
    <button class="btn btn-up" id="upBtn">▲</button>
    <button class="btn btn-left" id="leftBtn">◀</button>
    <button class="btn btn-down" id="downBtn">▼</button>
    <button class="btn btn-right" id="rightBtn">▶</button>
  </div>

  <div class="game-over-overlay" id="gameOverOverlay">
    <h1 style="color: #ef4444; font-size: 32px;">Game Over</h1>
    <p style="color: #94a3b8; margin-top: 8px;">Final Score: <span id="finalScore">0</span></p>
    <button class="restart-btn" id="restartBtn">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let dx = 1, dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high') || 0;
    document.getElementById('highScore').innerText = highScore;
    let gameInterval = null;
    let isGameOver = false;

    function randomFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function gameLoop() {
      if (isGameOver) return;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
      }
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_high', highScore);
          document.getElementById('highScore').innerText = highScore;
        }
        randomFood();
      } else {
        snake.pop();
      }

      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? '#38bdf8' : '#0284c7';
        ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
      }
    }

    function changeDir(newDx, newDy) {
      if (dx === -newDx && newDx !== 0) return;
      if (dy === -newDy && newDy !== 0) return;
      dx = newDx;
      dy = newDy;
    }

    document.getElementById('upBtn').onclick = () => changeDir(0, -1);
    document.getElementById('downBtn').onclick = () => changeDir(0, 1);
    document.getElementById('leftBtn').onclick = () => changeDir(-1, 0);
    document.getElementById('rightBtn').onclick = () => changeDir(1, 0);

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', e => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) changeDir(1, 0);
        else if (diffX < -30) changeDir(-1, 0);
      } else {
        if (diffY > 30) changeDir(0, 1);
        else if (diffY < -30) changeDir(0, -1);
      }
    });

    function endGame() {
      isGameOver = true;
      clearInterval(gameInterval);
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverOverlay').style.display = 'flex';
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 1; dy = 0;
      score = 0;
      document.getElementById('score').innerText = '0';
      isGameOver = false;
      document.getElementById('gameOverOverlay').style.display = 'none';
      randomFood();
      clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 120);
    }

    document.getElementById('restartBtn').onclick = resetGame;
    resetGame();
  </script>
</body>
</html>
