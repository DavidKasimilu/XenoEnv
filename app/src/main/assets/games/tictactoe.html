<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Tic-Tac-Toe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .title { font-size: 26px; font-weight: bold; color: #a855f7; margin-bottom: 8px; text-shadow: 0 0 10px rgba(168,85,247,0.5); }
  .status { font-size: 16px; color: #94a3b8; margin-bottom: 20px; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 96px);
    grid-template-rows: repeat(3, 96px);
    gap: 12px;
  }
  .cell {
    background: #1e1b4b;
    border: 2px solid #6366f1;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(99,102,241,0.2);
    transition: transform 0.1s, background 0.15s;
  }
  .cell:active { transform: scale(0.94); background: #312e81; }
  .cell.x { color: #38bdf8; text-shadow: 0 0 12px #38bdf8; }
  .cell.o { color: #f43f5e; text-shadow: 0 0 12px #f43f5e; }
  .btn-row { margin-top: 24px; display: flex; gap: 12px; }
  .btn {
    padding: 12px 20px;
    background: #4f46e5;
    color: white;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(79,70,229,0.3);
  }
  .btn:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div class="title">Neon Tic-Tac-Toe</div>
  <div class="status" id="statusText">Your turn (X) vs AI</div>

  <div class="board" id="board">
    <div class="cell" data-idx="0"></div>
    <div class="cell" data-idx="1"></div>
    <div class="cell" data-idx="2"></div>
    <div class="cell" data-idx="3"></div>
    <div class="cell" data-idx="4"></div>
    <div class="cell" data-idx="5"></div>
    <div class="cell" data-idx="6"></div>
    <div class="cell" data-idx="7"></div>
    <div class="cell" data-idx="8"></div>
  </div>

  <div class="btn-row">
    <button class="btn" id="restartBtn">New Game</button>
  </div>

  <script>
    let board = ["","","","","","","","",""];
    let isGameOver = false;
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('statusText');

    const winPatterns = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function checkWin(b, player) {
      return winPatterns.some(pattern => pattern.every(idx => b[idx] === player));
    }

    function checkTie(b) {
      return b.every(cell => cell !== "");
    }

    cells.forEach(cell => {
      cell.onclick = () => {
        const idx = parseInt(cell.dataset.idx);
        if (board[idx] !== "" || isGameOver) return;
        makeMove(idx, "X");
        if (checkWin(board, "X")) {
          statusText.innerText = "You Win! 🎉";
          isGameOver = true;
          return;
        }
        if (checkTie(board)) {
          statusText.innerText = "It's a Draw! 🤝";
          isGameOver = true;
          return;
        }

        statusText.innerText = "AI is thinking...";
        setTimeout(aiMove, 250);
      };
    });

    function makeMove(idx, player) {
      board[idx] = player;
      cells[idx].innerText = player;
      cells[idx].classList.add(player.toLowerCase());
    }

    function aiMove() {
      if (isGameOver) return;
      // Winning move
      for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
          board[i] = "O";
          if (checkWin(board, "O")) {
            cells[i].innerText = "O";
            cells[i].classList.add("o");
            statusText.innerText = "AI Wins! 🤖";
            isGameOver = true;
            return;
          }
          board[i] = "";
        }
      }
      // Block player
      for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
          board[i] = "X";
          if (checkWin(board, "X")) {
            board[i] = "O";
            cells[i].innerText = "O";
            cells[i].classList.add("o");
            statusText.innerText = "Your turn (X)";
            return;
          }
          board[i] = "";
        }
      }
      // Take center
      if (board[4] === "") {
        makeMove(4, "O");
      } else {
        const available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
        if (available.length > 0) {
          const move = available[Math.floor(Math.random() * available.length)];
          makeMove(move, "O");
        }
      }

      if (checkWin(board, "O")) {
        statusText.innerText = "AI Wins! 🤖";
        isGameOver = true;
      } else if (checkTie(board)) {
        statusText.innerText = "It's a Draw! 🤝";
        isGameOver = true;
      } else {
        statusText.innerText = "Your turn (X)";
      }
    }

    document.getElementById('restartBtn').onclick = () => {
      board = ["","","","","","","","",""];
      isGameOver = false;
      cells.forEach(c => {
        c.innerText = "";
        c.classList.remove('x','o');
      });
      statusText.innerText = "Your turn (X) vs AI";
    };
  </script>
</body>
</html>
