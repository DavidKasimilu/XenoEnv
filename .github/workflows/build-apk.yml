name: Build APKs (Debug & Benchmark) & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Version >= 17
        run: |
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java major version must be >= 17, but found $JAVA_VER"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug.keystore and .env.example exist
        run: |
          if [ ! -f "./.env.example" ]; then
            echo "# Environment variables placeholder" > ./.env.example
          else
            sed -i '/^[A-Za-z0-9_]*=[[:space:]]*$/d' ./.env.example
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Build Both APKs (Debug & Benchmark)
        run: gradle :app:assembleDebug :app:assembleBenchmark --stacktrace --no-daemon

      - name: Verify APK Outputs
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          BENCH_APK="app/build/outputs/apk/benchmark/app-benchmark.apk"

          for APK_PATH in "$DEBUG_APK" "$BENCH_APK"; do
            if [ ! -f "$APK_PATH" ]; then
              echo "Error: Expected APK file does not exist at $APK_PATH"
              exit 1
            fi
            if [ ! -s "$APK_PATH" ]; then
              echo "Error: APK file at $APK_PATH is empty (size 0 bytes)"
              exit 1
            fi
            echo "Verified $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"
          done

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Benchmark APK Artifact (Non-debuggable, signed with debug key)
        uses: actions/upload-artifact@v4
        with:
          name: app-benchmark-apk
          path: app/build/outputs/apk/benchmark/app-benchmark.apk
          if-no-files-found: error

      - name: Prepare Release Assets
        id: prep_asset
        run: |
          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')
          DEBUG_APK_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          BENCH_APK_NAME="${REPO_NAME}-benchmark-build-${{ github.run_number }}.apk"

          TMP_DEBUG="${RUNNER_TEMP}/${DEBUG_APK_NAME}"
          TMP_BENCH="${RUNNER_TEMP}/${BENCH_APK_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DEBUG"
          cp app/build/outputs/apk/benchmark/app-benchmark.apk "$TMP_BENCH"

          echo "debug_asset_path=${TMP_DEBUG}" >> "$GITHUB_OUTPUT"
          echo "debug_asset_name=${DEBUG_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "bench_asset_path=${TMP_BENCH}" >> "$GITHUB_OUTPUT"
          echo "bench_asset_name=${BENCH_APK_NAME}" >> "$GITHUB_OUTPUT"

          echo "release_tag=build-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "release_title=Build #${{ github.run_number }} (Debug & Benchmark)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.prep_asset.outputs.release_tag }}"
          TITLE="${{ steps.prep_asset.outputs.release_title }}"
          DEBUG_ASSET="${{ steps.prep_asset.outputs.debug_asset_path }}"
          BENCH_ASSET="${{ steps.prep_asset.outputs.bench_asset_path }}"
          NOTES="Automated APK build for commit \`${{ github.sha }}\` from branch \`${{ github.ref_name }}\`. Includes both Debug and Benchmark (non-debuggable, AOT-profiled) APKs signed with debug key."

          gh release create "$TAG" "$BENCH_ASSET" "$DEBUG_ASSET" \
            --target "${{ github.sha }}" \
            --latest \
            --title "$TITLE" \
            --notes "$NOTES"

      - name: Generate Summary Report
        if: always()
        run: |
          echo "## 📱 APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run Number:** \`${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug APK:** \`${{ steps.prep_asset.outputs.debug_asset_name }}\` (Artifact: \`app-debug-apk\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Benchmark APK:** \`${{ steps.prep_asset.outputs.bench_asset_name }}\` (Artifact: \`app-benchmark-apk\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "✅ **GitHub Release Published:** [\`${{ steps.prep_asset.outputs.release_tag }}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.prep_asset.outputs.release_tag }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Release Publishing:** Not published via Release API. Download APKs directly from the **Artifacts** section of this Actions run." >> "$GITHUB_STEP_SUMMARY"
          fi
